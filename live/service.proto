syntax = "proto3";

package elephant.live;

option go_package = "github.com/ttab/elephant-public-api/live";

import "newsdoc/newsdoc.proto";

// Blogs is the administrative RPC surface for managing live blogs. All
// methods require an authenticated caller; mutating methods additionally
// require the "liveblog_write" scope, read methods accept "liveblog_read"
// or "liveblog_write".
service Blogs {
  // CreateBlog creates a new live blog. If id is left empty the server
  // generates one.
  rpc CreateBlog(CreateBlogRequest) returns (CreateBlogResponse);

  // UpdateBlog updates the mutable metadata of an existing blog.
  rpc UpdateBlog(UpdateBlogRequest) returns (UpdateBlogResponse);

  // ListBlogs lists blogs, newest first.
  rpc ListBlogs(ListBlogsRequest) returns (ListBlogsResponse);

  // GetBlog returns a single blog by id.
  rpc GetBlog(GetBlogRequest) returns (GetBlogResponse);

  // DeleteBlog deletes a blog and all of its posts and events.
  rpc DeleteBlog(DeleteBlogRequest) returns (DeleteBlogResponse);
}

// Posts is the administrative RPC surface for managing the posts of a live
// blog. Mutating methods require the "liveblog_write" scope.
service Posts {
  // CreatePost appends a new post to a blog and returns it with its
  // assigned sequential id. Fails with failed_precondition until a
  // configuration generation has been activated.
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);

  // ListPosts lists the posts of a blog, newest first. Read methods accept
  // the "liveblog_read" or "liveblog_write" scope.
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);

  // ListPinnedPosts lists a blog's pinned posts, highest priority first.
  // Unlike ListPosts it is not paginated: pinned posts are few and are
  // always returned in full so callers can surface them regardless of where
  // they fall in the timeline.
  rpc ListPinnedPosts(ListPinnedPostsRequest) returns (ListPinnedPostsResponse);

  // GetPost returns a single post by id.
  rpc GetPost(GetPostRequest) returns (GetPostResponse);

  // UpdatePost replaces the content, pinning and flags of an existing
  // post, bumping its version. Fails with failed_precondition until a
  // configuration generation has been activated.
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);

  // DeletePost removes a post from a blog.
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);

  // SetPinPriority sets the pin priority of a post. A priority greater
  // than zero pins the post; zero unpins it.
  rpc SetPinPriority(SetPinPriorityRequest) returns (SetPinPriorityResponse);
}

// Blog is a live blog and its metadata.
message Blog {
  // Id is the blog UUID.
  string id = 1;
  // Title of the blog.
  string title = 2;
  // Description of the blog.
  string description = 3;
  // Language is the BCP 47 language tag of the blog contents.
  string language = 4;
  // Active marks whether the blog is currently running.
  bool active = 5;
  // Created is the RFC3339 creation timestamp.
  string created = 6;
  // CreatedBy is the subject that created the blog.
  string created_by = 7;
}

// Post is a single entry in a live blog.
message Post {
  // Id is the sequential per-blog post id.
  int64 id = 1;
  // Version increments every time the post is updated.
  int64 version = 2;
  // Created is the RFC3339 creation timestamp.
  string created = 3;
  // Updated is the RFC3339 timestamp of the last update.
  string updated = 4;
  // Content is the post body as a NewsDoc document.
  newsdoc.Document content = 5;
  // PinPriority pins the post when greater than zero; higher sorts first.
  int32 pin_priority = 6;
  // Flags are free-form labels attached to the post.
  repeated string flags = 7;
}

message CreateBlogRequest {
  // Title of the blog. The blog id is always generated by the server.
  string title = 1;
  // Description of the blog.
  string description = 2;
  // Language is the BCP 47 language tag of the blog contents.
  string language = 3;
  // Active marks whether the blog starts out running.
  bool active = 4;
}

message CreateBlogResponse {
  // Blog is the created blog.
  Blog blog = 1;
}

message UpdateBlogRequest {
  // Id of the blog to update.
  string id = 1;
  // Title of the blog.
  string title = 2;
  // Description of the blog.
  string description = 3;
  // Language is the BCP 47 language tag of the blog contents.
  string language = 4;
  // Active marks whether the blog is running.
  bool active = 5;
}

message UpdateBlogResponse {
  // Blog is the updated blog.
  Blog blog = 1;
}

message ListBlogsRequest {
  // OnlyActive restricts the result to running blogs.
  bool only_active = 1;
  // Limit caps the number of blogs returned. The server applies a default
  // and maximum when zero or too large.
  int32 limit = 2;
  // Offset skips this many blogs from the start of the (newest first)
  // result, for page-numbered pagination.
  int32 offset = 3;
}

message ListBlogsResponse {
  // Blogs is the list of blogs, newest first.
  repeated Blog blogs = 1;
  // Total is the total number of blogs matching the request, ignoring
  // limit and offset, so clients can compute the number of pages.
  int32 total = 2;
}

message GetBlogRequest {
  // Id of the blog to fetch.
  string id = 1;
}

message GetBlogResponse {
  // Blog is the requested blog.
  Blog blog = 1;
}

message DeleteBlogRequest {
  // Id of the blog to delete.
  string id = 1;
}

message DeleteBlogResponse {}

message CreatePostRequest {
  // BlogId of the blog to append to.
  string blog_id = 1;
  // Content is the post body as a NewsDoc document.
  newsdoc.Document content = 2;
  // PinPriority pins the post when greater than zero.
  int32 pin_priority = 3;
  // Flags are free-form labels attached to the post.
  repeated string flags = 4;
  // IdempotencyKey is an optional client-generated key (unique per blog,
  // at most 128 characters) that makes retries safe: repeating a
  // CreatePost with the same key returns the post created by the first
  // request instead of creating a duplicate.
  string idempotency_key = 5;
}

message CreatePostResponse {
  // Post is the created post.
  Post post = 1;
}

message ListPostsRequest {
  // BlogId of the blog to list posts for.
  string blog_id = 1;
  // BeforeId is an exclusive cursor; only posts with a lower id are
  // returned. Zero starts from the newest post.
  int64 before_id = 2;
  // Limit caps the number of posts returned. The server applies a default
  // and maximum when zero or too large.
  int32 limit = 3;
}

message ListPostsResponse {
  // Posts are the matching posts, newest first.
  repeated Post posts = 1;
  // HasMore is true when older posts exist beyond the returned page.
  bool has_more = 2;
}

message ListPinnedPostsRequest {
  // BlogId of the blog to list pinned posts for.
  string blog_id = 1;
}

message ListPinnedPostsResponse {
  // Posts are the pinned posts, highest priority first.
  repeated Post posts = 1;
}

message GetPostRequest {
  // BlogId of the post's blog.
  string blog_id = 1;
  // Id of the post to fetch.
  int64 id = 2;
}

message GetPostResponse {
  // Post is the requested post.
  Post post = 1;
}

message UpdatePostRequest {
  // BlogId of the post's blog.
  string blog_id = 1;
  // Id of the post to update.
  int64 id = 2;
  // Content is the new post body as a NewsDoc document.
  newsdoc.Document content = 3;
  // PinPriority pins the post when greater than zero.
  int32 pin_priority = 4;
  // Flags are free-form labels attached to the post.
  repeated string flags = 5;
}

message UpdatePostResponse {
  // Post is the updated post.
  Post post = 1;
}

message DeletePostRequest {
  // BlogId of the post's blog.
  string blog_id = 1;
  // Id of the post to delete.
  int64 id = 2;
}

message DeletePostResponse {}

message SetPinPriorityRequest {
  // BlogId of the post's blog.
  string blog_id = 1;
  // Id of the post to pin or unpin.
  int64 id = 2;
  // PinPriority to set; zero unpins the post.
  int32 pin_priority = 3;
}

message SetPinPriorityResponse {
  // Post is the updated post.
  Post post = 1;
}

// Configuration manages the post validation configuration: immutable revisor
// schema specs and activatable configuration generations that select a schema
// set and the document types accepted as post content. Mutating methods
// require the "liveblog_admin" scope; read methods also accept
// "liveblog_read" or "liveblog_write".
service Configuration {
  // RegisterConfigGeneration registers a new configuration generation.
  // Schema versions that are already stored can be referenced by name and
  // version without re-supplying the spec; a supplied spec for an existing
  // version must match the stored one. The full configuration is validated
  // on registration: the schemas must compile into a validator and every
  // post type must be declared by them.
  rpc RegisterConfigGeneration(RegisterConfigGenerationRequest) returns (RegisterConfigGenerationResponse);

  // ActivateConfigGeneration switches the active configuration to the
  // given generation.
  rpc ActivateConfigGeneration(ActivateConfigGenerationRequest) returns (ActivateConfigGenerationResponse);

  // GetActiveConfigGeneration returns the currently active generation,
  // including its schemas. Supports long polling for changes. No active
  // generation is an empty response, not an error.
  rpc GetActiveConfigGeneration(GetActiveConfigGenerationRequest) returns (GetActiveConfigGenerationResponse);

  // ListConfigGenerations lists historical generations, most recent first.
  rpc ListConfigGenerations(ListConfigGenerationsRequest) returns (ListConfigGenerationsResponse);

  // GetSchema retrieves a stored schema spec by name and version. An empty
  // version resolves to the version included in the active generation.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
}

// ConfigGenerationSchema references a schema version included in a
// generation. Spec is optional when the version is already stored; it is
// required when registering a new (name, version) pair.
message ConfigGenerationSchema {
  // Name of the schema.
  string name = 1;
  // Version is the semver version of the schema, stored canonicalised.
  string version = 2;
  // Spec is the revisor constraint-set JSON.
  string spec = 3;
}

// ConfigGeneration is a registered post validation configuration snapshot.
message ConfigGeneration {
  // Id is assigned by the server on registration.
  int64 id = 1;
  // Description is an optional human-readable tag.
  string description = 2;
  // CreatedAt is the time of registration, RFC3339.
  string created_at = 3;
  // ActivatedAt is the time the generation was last activated, RFC3339, or
  // empty if it has never been activated.
  string activated_at = 4;
  // Active is true for the currently active generation.
  bool active = 5;
  // Schemas in the generation, in registration order. Not populated by
  // ListConfigGenerations.
  repeated ConfigGenerationSchema schemas = 6;
  // PostTypes are the document types accepted as post content.
  repeated string post_types = 7;
}

message RegisterConfigGenerationRequest {
  // Description is an optional human-readable tag for the new generation.
  string description = 1;
  // Schemas the generation should contain, at least one. Order is
  // preserved.
  repeated ConfigGenerationSchema schemas = 2;
  // PostTypes are the document types accepted as post content, at least
  // one. Every type must be declared by the schemas.
  repeated string post_types = 3;
  // Activate the new generation immediately. Defaults to false; callers
  // typically register first and activate as a separate step so they can
  // inspect the result first.
  bool activate = 4;
}

message RegisterConfigGenerationResponse {
  // Generation is the persisted generation, with its assigned id.
  ConfigGeneration generation = 1;
}

message ActivateConfigGenerationRequest {
  // Id of the generation to activate.
  int64 id = 1;
}

message ActivateConfigGenerationResponse {
  // Generation is the activated generation.
  ConfigGeneration generation = 1;
}

message GetActiveConfigGenerationRequest {
  // WaitSeconds is the maximum number of seconds to wait for the active
  // generation to differ from KnownId. Defaults to 10. Optional.
  int64 wait_seconds = 1;
  // KnownId is the generation id the client already has; the call returns
  // immediately when the active generation differs. Optional.
  int64 known_id = 2;
  // OnlyChanged returns an empty response (with Unchanged=true) if the
  // active generation matches KnownId.
  bool only_changed = 3;
}

message GetActiveConfigGenerationResponse {
  // Generation is the active generation, populated with schemas. Unset
  // when no generation is active.
  ConfigGeneration generation = 1;
  // Unchanged is true if KnownId matched the active generation and
  // OnlyChanged was set.
  bool unchanged = 2;
}

message ListConfigGenerationsRequest {
  // Before is the highest generation id to return; defaults to the latest.
  // Use the smallest returned id to paginate further into the past.
  int64 before = 1;
  // PageSize defaults to 50, max 200.
  int64 page_size = 2;
}

message ListConfigGenerationsResponse {
  // Generations without schemas populated, newest first.
  repeated ConfigGeneration generations = 1;
}

message GetSchemaRequest {
  // Name of the schema to get.
  string name = 1;
  // Version of the schema to get; empty resolves to the version in the
  // active generation.
  string version = 2;
}

message GetSchemaResponse {
  // Version of the returned schema.
  string version = 1;
  // Spec is the revisor constraint-set JSON.
  string spec = 2;
}
