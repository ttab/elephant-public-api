syntax = "proto3";

package elephant.assets.v1;

option go_package = "github.com/ttab/elephant-public-api/elephant/assets/v1;assetsv1";

// KeysService serves the asset CDN signing keys and delivery configuration to
// URL-minting services. The asset service is the key authority: it
// generates and rotates the keys, and both signers and the CDN edge get
// key material from it, so they can never disagree. Callers authorize
// with normal client credentials — a scope in their access token grants
// these methods, nothing more.
service KeysService {
  // GetSigningKeys returns the current signing key set: active, upcoming
  // (pre-distributed before their not_before), and recently expired keys.
  // Signers cache the set and select the delivery key whose validity
  // window covers the current time.
  rpc GetSigningKeys(GetSigningKeysRequest) returns (GetSigningKeysResponse);

  // GetVariants returns the configured rendition variants. The asset
  // service owns variant geometry, so URL-minting services fetch it from
  // here — caching and refreshing in the background like the signing
  // keys — to learn which variants exist and to compute rendition size
  // hints from an asset's source dimensions.
  rpc GetVariants(GetVariantsRequest) returns (GetVariantsResponse);

  // SignURL mints a signed asset URL server-side from the request
  // parameters, as a debugging aid — the service picks the appropriate key
  // (the public key for a non-expiring exp=0 token, the active delivery key
  // otherwise) and returns the token, path, and canonical string. Production
  // signers mint URLs themselves from GetSigningKeys; this is for
  // inspecting and reproducing signatures. Requires asset_keys_read.
  rpc SignURL(SignURLRequest) returns (SignURLResponse);
}

message SignURLRequest {
  // Ns is the source namespace.
  string ns = 1;
  // Id of the asset in the namespace's id scheme.
  string id = 2;
  // Version of the asset; defaults to the current version ("0").
  string version = 3;
  // Selector defaults to "full"; a soft crop is "c-{x}-{y}-{w}-{h}",
  // optionally carrying a focus point "c-{x}-{y}-{w}-{h}-{fx}-{fy}".
  string selector = 4;
  // Aud is the audience the token is minted for.
  string aud = 5;
  // Exp is the unix expiry; 0 mints a non-expiring token, signed with the
  // public key and only valid at the edge for public renditions. Mutually
  // exclusive with exp_after.
  int64 exp = 6;
  // Variant names the rendition the token authorizes, including any class
  // suffix (e.g. "preview-wm"), or "original". The signature covers the
  // full path, so the variant is part of what is signed.
  string variant = 7;
  // Ext is the format extension, e.g. "jpg"; empty for "original".
  string ext = 8;
  // ExpAfter sets the expiry as a duration from now, a friendlier
  // alternative to a raw unix exp for a debug endpoint. It accepts Go
  // duration syntax extended with a "d" (days) unit, e.g. "30d", "12h", or
  // "1d12h". Mutually exclusive with exp; when both exp and exp_after are
  // unset the token is non-expiring (exp=0).
  string exp_after = 9;
}

message SignURLResponse {
  // Token is the value for the "s" query parameter.
  string token = 1;
  // Path is the signed request path,
  // "/v1/{ns}/{id}/{version}/{selector}/{variant}.{ext}".
  string path = 2;
  // Url is the ready-to-use asset URL: the signed path plus "?s={token}".
  // Absolute when the service is configured with its external base URL
  // (CDN_BASE_URL); otherwise a path to which the caller prepends the CDN
  // host.
  string url = 3;
  // Kid is the key that signed the token.
  string kid = 4;
  // Canonical is the newline-joined string the MAC covers, for debugging
  // signature mismatches.
  string canonical = 5;
}

message GetSigningKeysRequest {}

message GetSigningKeysResponse {
  repeated SigningKey keys = 1;
}

message GetVariantsRequest {}

message GetVariantsResponse {
  repeated Variant variants = 1;
  // Classes declared in the delivery configuration, referenced by name
  // from the variants' classes lists.
  repeated VariantClass classes = 2;
}

// VariantClass is a modifier applied to a base variant via the
// {variant}-{class} suffix, e.g. the wm class turning preview into
// preview-wm.
message VariantClass {
  // Name of the class, used as the {variant}-{class} suffix.
  string name = 1;
  // Public marks renditions carrying this class as public derivatives:
  // reachable with non-expiring (exp=0) tokens signed with the public
  // key. A rendition is public when its base variant or its class is
  // public.
  bool public = 2;
}

message Variant {
  // Name of the variant, used as the variant path segment in asset URLs.
  string name = 1;
  // Kind is the asset kind the variant applies to, e.g. "image".
  string kind = 2;
  // Max is the bounding box in pixels (longest side) for fit:inside image
  // variants.
  int64 max = 3;
  // Fit controls how an image is fitted: "inside" scales down into the
  // max bounding box (never upscaling); "cover" crops to the
  // width/height aspect around the selector's focus point and scales to
  // that size.
  string fit = 4;
  // Public marks the variant as a public derivative: reachable with
  // non-expiring (exp=0) tokens.
  bool public = 5;
  // Classes are the class names available as a {variant}-{class} suffix,
  // e.g. "wm" makes {variant}-wm a public watermarked rendition.
  repeated string classes = 6;
  // Width and Height are the fixed output size of fit:cover variants.
  int64 width = 7;
  int64 height = 8;
}

message SigningKey {
  // Kid is the key identifier carried in minted tokens.
  string kid = 1;
  // Secret is the hex-encoded HMAC key material.
  string secret = 2;
  // NotBefore is the start of the validity window, unix seconds.
  int64 not_before = 3;
  // NotAfter is the end of the validity window, unix seconds.
  int64 not_after = 4;
  // Use is "delivery" for routinely rotated delivery keys or "public"
  // for the long-lived key that signs permanent public URLs.
  string use = 5;
}

// ManagementService exposes the take-down operations: one authorized call instead
// of a runbook of raw AWS actions, callable by editorial tooling or event
// handlers as well as by humans. Note that in the ingest model a take-down
// only stops new deliveries — customers already hold ingested copies, so
// the take-down workflow is primarily a customer-notification process with
// this RPC as one step.
service ManagementService {
  // Takedown purges an asset's derivatives from the derivatives bucket
  // and invalidates its CDN paths. Optionally pins the asset to a single
  // selector at the edge (the retroactive-crop kill switch): with a pin
  // set, requests for any other selector are rejected regardless of token
  // validity.
  rpc Takedown(TakedownRequest) returns (TakedownResponse);
  // RemoveSelectorPin removes a selector pin. Safe once every token
  // minted before the pin was set has expired (the maximum token
  // lifetime is 30 days) and issuance-time enforcement is in place.
  rpc RemoveSelectorPin(RemoveSelectorPinRequest) returns (RemoveSelectorPinResponse);
  // SetAudienceDeny adds or removes an audience deny-list entry at the
  // edge: coarse revocation of every URL signed for the audience.
  rpc SetAudienceDeny(SetAudienceDenyRequest) returns (SetAudienceDenyResponse);
  // WarmIntermediate queues population of the cached intermediate for an
  // asset, so the first derivative request doesn't pay the original
  // fetch. Fire-and-forget: the response reports queueing, not
  // completion. Requires the asset_warm or asset_admin scope.
  rpc WarmIntermediate(WarmIntermediateRequest) returns (WarmIntermediateResponse);
  // ListMetadataFields returns the operator-configured metadata fields that
  // extend the built-in cropped-rendition whitelist (spec §7.5).
  rpc ListMetadataFields(ListMetadataFieldsRequest) returns (ListMetadataFieldsResponse);
  // AddMetadataField adds (or updates) one metadata field to preserve on
  // cropped renditions, taking effect without a redeploy. It only widens the
  // recognized-field set; the structural safety filters (no thumbnails, no
  // binary payloads) are enforced in code regardless. Requires asset_admin.
  rpc AddMetadataField(AddMetadataFieldRequest) returns (AddMetadataFieldResponse);
  // RemoveMetadataField removes a configured metadata field. Built-in
  // defaults cannot be removed. Requires asset_admin.
  rpc RemoveMetadataField(RemoveMetadataFieldRequest) returns (RemoveMetadataFieldResponse);
  // InspectCropMetadata fetches an asset and reports the metadata fields a
  // crop would drop under the current whitelist — known EXIF/IPTC fields with
  // their alias, everything else with its raw id, each with a readable value.
  // A diagnostic for "why did field X disappear from a cropped image".
  // Requires asset_admin.
  rpc InspectCropMetadata(InspectCropMetadataRequest) returns (InspectCropMetadataResponse);
}

// MetadataField is one recognized field kept on cropped renditions beyond the
// built-in whitelist. Exactly one group of fields applies per kind.
message MetadataField {
  // Kind is "exif", "iptc", or "xmp".
  string kind = 1;
  // ExifIfd selects the EXIF sub-IFD for kind "exif": "ifd0" or "exif".
  string exif_ifd = 2;
  // Tag is the EXIF tag id for kind "exif" (e.g. 40091). UNDEFINED-typed or
  // oversized values are still dropped by the transform regardless.
  uint32 tag = 3;
  // Dataset is the IPTC-IIM record-2 dataset number for kind "iptc".
  uint32 dataset = 4;
  // Namespace is the XMP property namespace URI for kind "xmp".
  string namespace = 5;
  // Prefix is the preferred XMP serialization prefix for kind "xmp".
  string prefix = 6;
  // Local is the XMP property local name for kind "xmp".
  string local = 7;
  // Form is the XMP RDF shape for kind "xmp": "simple", "alt", "seq", or
  // "bag".
  string form = 8;
  // Alias references a built-in EXIF/IPTC field by name (e.g.
  // "DateTimeOriginal", "By-line"), an alternative to spelling out kind, ifd,
  // tag, or dataset when adding a field. Aliases are defined in code and
  // cannot be created through the API. Ignored for XMP.
  string alias = 9;
}

// DroppedField is one metadata field a crop would drop, as reported by
// InspectCropMetadata.
message DroppedField {
  // Field is the concrete descriptor; pass it straight back to
  // AddMetadataField to start preserving it (when addable). Its alias holds
  // the human name for known EXIF/IPTC fields, empty for wholly unknown ones.
  MetadataField field = 1;
  // Id is the raw underlying identifier, always set (e.g. "ifd0/0x9291",
  // "2:0x64", or an XMP "namespace local").
  string id = 2;
  // Value is a readable representation of the field's value, truncated.
  string value = 3;
  // Reason is why the field drops ("not in whitelist", "binary value",
  // "embedded thumbnail", ...).
  string reason = 4;
  // Addable is true when the field can be preserved by adding it to the
  // whitelist; false for structural drops (thumbnails, binary payloads) that
  // are dropped regardless of configuration.
  bool addable = 5;
}

message InspectCropMetadataRequest {
  // Ns is the source namespace of the asset.
  string ns = 1;
  // Id of the asset in the namespace's id scheme.
  string id = 2;
  // Version of the asset; defaults to the current version ("0").
  string version = 3;
}

message InspectCropMetadataResponse {
  // Dropped lists the fields a crop would drop, most useful first is not
  // guaranteed — clients should present them grouped by kind.
  repeated DroppedField dropped = 1;
}

message ListMetadataFieldsRequest {}

message ListMetadataFieldsResponse {
  // Fields are the configured extras (built-in defaults are not listed).
  repeated MetadataField fields = 1;
}

message AddMetadataFieldRequest {
  // Field to add or update.
  MetadataField field = 1;
}

message AddMetadataFieldResponse {}

message RemoveMetadataFieldRequest {
  // Field to remove; the kind and its identifying fields must match.
  MetadataField field = 1;
}

message RemoveMetadataFieldResponse {}

message TakedownRequest {
  // Ns is the source namespace of the asset.
  string ns = 1;
  // Id of the asset in the namespace's id scheme.
  string id = 2;
  // Version narrows the purge to a single version. Optional; the default
  // purges every version.
  string version = 3;
  // PinSelector pins the asset to this selector string at the edge
  // (e.g. "c-0.2-0.2-0.5-0.5"). Optional.
  string pin_selector = 4;
}

message TakedownResponse {
  // DeletedObjects is the number of derivatives removed from the bucket.
  int64 deleted_objects = 1;
  // InvalidationId of the CDN invalidation, empty when the service runs
  // without a CDN distribution configured.
  string invalidation_id = 2;
}

message RemoveSelectorPinRequest {
  // Ns is the source namespace of the asset.
  string ns = 1;
  // Id of the asset in the namespace's id scheme.
  string id = 2;
}

message RemoveSelectorPinResponse {}

message SetAudienceDenyRequest {
  // Aud is the audience identifier.
  string aud = 1;
  // Denied adds the deny entry when true and removes it when false.
  bool denied = 2;
}

message SetAudienceDenyResponse {}

message WarmIntermediateRequest {
  // Ns is the source namespace of the asset.
  string ns = 1;
  // Id of the asset in the namespace's id scheme.
  string id = 2;
  // Version of the asset; defaults to the current version ("0").
  string version = 3;
}

message WarmIntermediateResponse {
  // State is "queued" (population is pending, including when it already
  // was), "cached" (an intermediate already exists), or "disabled" (the
  // namespace doesn't use the intermediate cache — not an error, so
  // fire-and-forget callers stay quiet across config changes).
  string state = 1;
}

// StorageService stores originals in the "assets" namespace: material that
// lives in no other archive, such as third-party PDFs and audio, uploaded
// straight to the service's own bucket and delivered through the CDN with
// the same signed URLs, take-down flow and caching as every other
// namespace. An asset is identified by a server-assigned UUID and has
// monotone versions starting at 1; version "0" in a URL is the current one.
//
// An upload is two calls around a direct PUT to object storage:
// CreateUpload returns a presigned URL, the client PUTs the bytes to it,
// and CommitUpload checks the bytes and makes them an asset version. Until
// it is committed an upload is reachable by no URL.
//
// The RPCs return paths, never signed URLs. Callers sign a returned path
// themselves from KeysService.GetSigningKeys, as every other URL-minting
// service does.
//
// All methods require asset_store, except that asset_admin also opens
// GetAsset and RestoreAsset, and an immediate DeleteAsset requires
// asset_admin, which asset_store alone does not satisfy. asset_store is deliberately separate from the
// repository's asset_upload. Authorization over an existing asset is
// scope-only: any asset_store holder may replace, delete or restore any
// asset. Nothing is lost by that — old versions are kept forever, a delete
// is soft and restorable, and created_by is recorded per version.
service StorageService {
  // CreateUpload starts an upload of a new asset, or of a new version of
  // an existing one, and returns a presigned PUT URL for its bytes.
  //
  // The extension of the filename picks an entry in the upload allow-list
  // (GetUploadTypes), and that entry decides the content type the asset is
  // stored and served as and the largest size accepted; the client never
  // chooses a content type. An extension that isn't allowed, a size above
  // the entry's max_size, a filename over 255 bytes or meta over 16 KiB
  // fail with InvalidArgument.
  //
  // What a client must get right:
  //
  // - size must be exactly the size of the file that will be PUT (File.size
  //   in a browser). The Content-Length is part of the signature, so any
  //   other length is refused by object storage with an opaque signature
  //   error, not by this service.
  // - The PUT must send exactly the returned headers, no more and no
  //   fewer. Content-Type is signed as well; a browser sets Content-Length
  //   itself from the body.
  // - When replacing, send if_version, the version the client believes is
  //   current. Without it a concurrent replacement is silently displaced
  //   (both versions survive, but neither editor learns of the other).
  //
  // Requires asset_store.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);

  // CommitUpload checks the uploaded bytes against the declared size and
  // the type the extension claims, stores them as the next version of the
  // asset, and returns the asset's path. Replacing an asset purges its
  // current-version ("0") renditions from the CDN; explicit-version paths
  // are immutable and need nothing.
  //
  // Only the caller that created the upload may commit it. The call is
  // idempotent: a retry, including one made while the first call is still
  // in progress, returns the same asset and version. It fails with
  // FailedPrecondition when no bytes have been PUT, when the asset was
  // deleted meanwhile, or when if_version no longer matches the current
  // version; with InvalidArgument when the bytes don't match the declared
  // size or type, in which case the upload is discarded.
  //
  // Requires asset_store.
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse);

  // GetAsset returns an asset's current version, its version history and
  // each version's metadata. A soft-deleted asset is returned too, with
  // deleted_at and the time it will be swept, so that a client can offer to
  // restore it. An asset whose first upload hasn't been committed is
  // NotFound.
  //
  // Requires asset_store or asset_admin.
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);

  // DeleteAsset soft-deletes an asset: every version stops being served at
  // once and its renditions are purged from the CDN, and the stored bytes
  // are removed after a retention period (30 days by default), until which
  // RestoreAsset undoes the delete.
  //
  // With immediate set the delete is irreversible: the bytes are removed
  // before the call returns, including the copies object storage keeps for
  // recovery. That is for legal removal and requires asset_admin. It also
  // works on an asset that is already soft-deleted. CDN edge caches may
  // still serve the asset until the invalidation completes, typically
  // within minutes.
  //
  // Requires asset_store; asset_admin when immediate is set.
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);

  // RestoreAsset undoes a soft delete. Renditions are regenerated on
  // demand, so the first requests after a restore may be slower, and may
  // keep failing for up to a minute while negative cache entries expire.
  // Fails with NotFound once the deleted asset has been swept.
  //
  // Requires asset_store or asset_admin.
  rpc RestoreAsset(RestoreAssetRequest) returns (RestoreAssetResponse);

  // GetUploadTypes returns the upload allow-list, so that a client can
  // refuse a file before uploading it rather than after.
  //
  // Requires asset_store.
  rpc GetUploadTypes(GetUploadTypesRequest) returns (GetUploadTypesResponse);
}

message CreateUploadRequest {
  // Filename is the name of the file being uploaded, at most 255 bytes. Its
  // extension selects the upload type; the name is kept per version and
  // offered as the download filename when the original is served.
  string filename = 1;
  // Size is the exact size of the file in bytes, which the PUT must match.
  int64 size = 2;
  // Meta is free-form provenance (source, credit, licence, ...), at most 16
  // KiB in all. It is stored with the version and returned only by
  // GetAsset; it never reaches the CDN.
  map<string, string> meta = 3;
  // AssetId names an existing asset to upload a new version of. Optional;
  // empty uploads a new asset. A replacement cannot change the asset's kind
  // (an image stays an image), but may change its extension within the
  // kind. Fails with FailedPrecondition for a deleted asset.
  string asset_id = 4;
  // IfVersion is the version the caller expects to be current when
  // replacing. It is checked here and again under lock at commit, and a
  // mismatch fails with FailedPrecondition. Optional, 0 skips the check,
  // but a client replacing an asset it has open should always send it.
  int64 if_version = 5;
}

message CreateUploadResponse {
  // UploadId identifies the upload in CommitUpload.
  string upload_id = 1;
  // Url is the presigned URL to PUT the bytes to.
  string url = 2;
  // Headers are the headers the PUT must send, exactly: they are part of
  // the signature.
  map<string, string> headers = 3;
  // Expires is when the URL stops being valid, unix seconds. An upload
  // left uncommitted is discarded some time after that.
  int64 expires = 4;
}

message CommitUploadRequest {
  // UploadId is the id CreateUpload returned.
  string upload_id = 1;
}

message CommitUploadResponse {
  // AssetId is the id of the new or replaced asset.
  string asset_id = 1;
  // Version is the version the upload became. Versions increase but are
  // not necessarily consecutive.
  int64 version = 2;
  // Path is the asset's unsigned current-version path,
  // "/v1/assets/{asset_id}/0/full/original". The original takes no
  // extension; it is served with the stored content type.
  string path = 3;
}

message GetAssetRequest {
  // AssetId is the id of the asset.
  string asset_id = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

// Asset is a stored asset and its version history.
message Asset {
  // Id of the asset, a lower-case hyphenated UUID.
  string id = 1;
  // Kind is "image", "audio" or "file", fixed by the first upload.
  string kind = 2;
  // CurrentVersion is the version "0" resolves to.
  int64 current_version = 3;
  // Path is the unsigned current-version path,
  // "/v1/assets/{id}/0/full/original".
  string path = 4;
  // CreatedBy is the subject that uploaded the first version.
  string created_by = 5;
  // CreatedAt is when the asset was created, unix seconds.
  int64 created_at = 6;
  // DeletedAt is when the asset was soft-deleted, unix seconds; 0 when it
  // isn't deleted.
  int64 deleted_at = 7;
  // SweepAt is when a soft-deleted asset's bytes will be removed, after
  // which it can no longer be restored, unix seconds; 0 when it isn't
  // deleted.
  int64 sweep_at = 8;
  // Versions are the asset's versions, oldest first.
  repeated AssetVersion versions = 9;
}

// AssetVersion is one stored version of an asset.
message AssetVersion {
  // Version number, starting at 1.
  int64 version = 1;
  // Path is the unsigned path of this version,
  // "/v1/assets/{asset_id}/{version}/full/original", which never changes.
  string path = 2;
  // Filename is the name the version was uploaded with.
  string filename = 3;
  // Ext is the canonical extension of the version's upload type, not
  // necessarily the one in Filename: an upload named "photo.jpeg" is
  // stored with ext "jpg". It is the extension the version is stored and
  // served under.
  string ext = 4;
  // ContentType is the content type the version is served as.
  string content_type = 5;
  // Size in bytes.
  int64 size = 6;
  // Sha256 is the hex-encoded SHA-256 of the bytes, computed by object
  // storage; empty when the store didn't provide one.
  string sha256 = 7;
  // Meta is the free-form metadata given at upload.
  map<string, string> meta = 8;
  // CreatedBy is the subject that uploaded the version.
  string created_by = 9;
  // CreatedAt is when the version was committed, unix seconds.
  int64 created_at = 10;
}

message DeleteAssetRequest {
  // AssetId is the id of the asset.
  string asset_id = 1;
  // Immediate removes the bytes at once and irreversibly instead of
  // soft-deleting. Requires asset_admin.
  bool immediate = 2;
}

message DeleteAssetResponse {}

message RestoreAssetRequest {
  // AssetId is the id of the asset.
  string asset_id = 1;
}

message RestoreAssetResponse {}

message GetUploadTypesRequest {}

message GetUploadTypesResponse {
  repeated UploadType types = 1;
}

// UploadType is one entry in the upload allow-list.
message UploadType {
  // Ext is the filename extension the entry matches, lower case and
  // without the dot, e.g. "jpeg".
  string ext = 1;
  // ContentType is what an upload with this extension is stored and
  // served as.
  string content_type = 2;
  // Kind is "image", "audio" or "file".
  string kind = 3;
  // MaxSize is the largest accepted upload in bytes.
  int64 max_size = 4;
  // CanonicalExt is the extension the upload is recorded under, e.g. "jpg"
  // for "jpeg"; the same as ext for a canonical entry.
  string canonical_ext = 5;
}
