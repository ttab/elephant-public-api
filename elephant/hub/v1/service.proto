syntax = "proto3";

package elephant.hub.v1;

option go_package = "github.com/ttab/elephant-public-api/elephant/hub/v1;hubv1";

// HubService provides the API for managing schemas and plugins in the
// Elephant Hub registry.
service HubService {
  // --- Organisation management ---

  // ListOrganisations returns all registered organisations.
  rpc ListOrganisations(ListOrganisationsRequest) returns (ListOrganisationsResponse);
  // ApproveOrganisation approves an organisation, allowing its members to log in.
  rpc ApproveOrganisation(ApproveOrganisationRequest) returns (ApproveOrganisationResponse);

  // --- Artifact browsing ---

  // ListArtifacts returns artifacts, optionally filtered by kind.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  // GetArtifact returns metadata for a specific artifact.
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  // GetArtifactVersion returns a specific version of an artifact including its manifest.
  rpc GetArtifactVersion(GetArtifactVersionRequest) returns (GetArtifactVersionResponse);
  // GetArtifactAsset returns the contents of a specific asset file.
  rpc GetArtifactAsset(GetArtifactAssetRequest) returns (GetArtifactAssetResponse);

  // --- Documentation ---

  // ListDocumentation returns the available documentation files for an artifact version.
  rpc ListDocumentation(ListDocumentationRequest) returns (ListDocumentationResponse);
  // GetDocumentation returns the contents of a specific documentation file.
  rpc GetDocumentation(GetDocumentationRequest) returns (GetDocumentationResponse);

  // --- Publishing ---

  // PublishVersion publishes a new version of a schema or plugin.
  rpc PublishVersion(PublishVersionRequest) returns (PublishVersionResponse);
  // BulkPublishVersion publishes new versions of multiple artifacts in a
  // single transaction. All items must use the same version and signing key.
  rpc BulkPublishVersion(BulkPublishVersionRequest) returns (BulkPublishVersionResponse);
  // RevokeVersion marks a published version as revoked.
  rpc RevokeVersion(RevokeVersionRequest) returns (RevokeVersionResponse);

  // --- Publishing key management ---

  // RegisterPublishingKey registers a new publishing key for the authenticated user.
  rpc RegisterPublishingKey(RegisterPublishingKeyRequest) returns (RegisterPublishingKeyResponse);
  // RegisterOrgPublishingKey registers a CI publishing key owned by an organisation.
  // Requires the caller to be an admin of the target organisation.
  rpc RegisterOrgPublishingKey(RegisterOrgPublishingKeyRequest) returns (RegisterOrgPublishingKeyResponse);
  // ListPublishingKeys lists registered publishing keys.
  rpc ListPublishingKeys(ListPublishingKeysRequest) returns (ListPublishingKeysResponse);
  // GetPublishingKey returns a single publishing key by fingerprint, so that a
  // consumer verifying an artifact signature can check the status of the
  // signing key. Public: no authentication is required, as for the artifact
  // browsing RPCs.
  rpc GetPublishingKey(GetPublishingKeyRequest) returns (GetPublishingKeyResponse);
  // DeactivatePublishingKey deactivates an active publishing key (e.g. for rotation).
  rpc DeactivatePublishingKey(DeactivatePublishingKeyRequest) returns (DeactivatePublishingKeyResponse);
  // ActivatePublishingKey activates a pending or deactivated publishing key.
  rpc ActivatePublishingKey(ActivatePublishingKeyRequest) returns (ActivatePublishingKeyResponse);
  // RevokePublishingKey permanently revokes a compromised publishing key.
  rpc RevokePublishingKey(RevokePublishingKeyRequest) returns (RevokePublishingKeyResponse);

  // --- Artifact permissions ---

  // AddAllowedPublishingKey adds a publishing key allowed to publish an artifact.
  rpc AddAllowedPublishingKey(AddAllowedPublishingKeyRequest) returns (AddAllowedPublishingKeyResponse);
  // RemoveAllowedPublishingKey removes a publishing key from an artifact's allow list.
  rpc RemoveAllowedPublishingKey(RemoveAllowedPublishingKeyRequest) returns (RemoveAllowedPublishingKeyResponse);
  // ListArtifactPermissions lists the publishing keys and CI publishers allowed for an artifact.
  rpc ListArtifactPermissions(ListArtifactPermissionsRequest) returns (ListArtifactPermissionsResponse);

  // --- Visibility ---

  // SetArtifactVisibility sets whether an artifact is publicly visible.
  rpc SetArtifactVisibility(SetArtifactVisibilityRequest) returns (SetArtifactVisibilityResponse);

  // --- Grants ---

  // AddArtifactGrant gives another organisation read access to an artifact,
  // all its versions: its manifests, assets and documentation, through this
  // service and through ClientService, as if the artifact were its own to
  // read. Requires the caller to administer the artifact's organisation.
  // Idempotent. The grantee's ClientService callers see the grant on
  // GetAccessChanges.
  rpc AddArtifactGrant(AddArtifactGrantRequest) returns (AddArtifactGrantResponse);
  // RemoveArtifactGrant withdraws a grant. The withdrawal reaches the
  // grantee on GetAccessChanges. Idempotent.
  rpc RemoveArtifactGrant(RemoveArtifactGrantRequest) returns (RemoveArtifactGrantResponse);
  // ListArtifactGrants lists the organisations an artifact is granted to.
  // Requires the caller to administer the artifact's organisation.
  rpc ListArtifactGrants(ListArtifactGrantsRequest) returns (ListArtifactGrantsResponse);
}

// ClientService is the API for machine clients of the hub: elephant-repository
// instances and the elephant BFF. Callers authenticate with OIDC client
// credentials from the nexus realm; the org claim identifies the
// organisation and the scope claim gates each method.
service ClientService {
  // --- Schema generations ---

  // RegisterGeneration records the schema set an elephant-repository
  // instance has activated. Idempotent on (caller, number). Every
  // (name, version) must be a published, non-revoked schema artifact
  // visible to the caller's organisation. Scope: hub_generations.
  rpc RegisterGeneration(RegisterGenerationRequest) returns (RegisterGenerationResponse);
  // GetLatestGeneration returns the highest generation number the caller
  // has registered, so a repository can resume after a restart.
  // Scope: hub_generations.
  rpc GetLatestGeneration(GetLatestGenerationRequest) returns (GetLatestGenerationResponse);

  // GetGeneration returns the schema set of a generation registered by any
  // client of the caller's organisation, so that a plugin's schemas can be
  // checked against what a repository activated. Scope: hub_generations.
  rpc GetGeneration(GetGenerationRequest) returns (GetGenerationResponse);
  // ListGenerations lists the generations every client of the caller's
  // organisation registered, newest first and without their schema sets,
  // so that a caller can find a repository's client id and read its
  // generation with GetGeneration. Scope: hub_generations.
  rpc ListGenerations(ListGenerationsRequest) returns (ListGenerationsResponse);

  // --- Plugin and schema loading ---

  // GetManifests resolves named artifact versions to their manifests, with
  // what a consumer needs to verify them: the signature, the signing key
  // and its status, and the version's status. Access is decided per
  // artifact: public, owned by the caller's organisation, or granted to
  // it. The response carries the GetAccessChanges position read in the
  // same snapshot, from which a consumer follows the feed to keep what it
  // cached correct. Scope: hub_assets.
  rpc GetManifests(GetManifestsRequest) returns (GetManifestsResponse);
  // GetAsset streams one asset of an artifact version, named by its role,
  // in chunks. It refuses a revoked version and one the caller cannot see.
  // The consumer checks the bytes against the SHA-256 the signed manifest
  // declares. Scope: hub_assets.
  rpc GetAsset(GetAssetRequest) returns (stream GetAssetResponse);
  // GetAccessChanges is a long-poll feed of the access changes the
  // caller's organisation can see, in both directions, in order from a
  // cursor: a version revoked; a publishing key deactivated, reactivated
  // or revoked; an artifact made private or public; a grant to the
  // caller's organisation added or withdrawn. It answers at once when
  // there are changes past the cursor, and otherwise waits for one or for
  // the call's deadline, answering with no changes. Events are kept
  // forever, so every cursor stays valid. Scope: hub_assets.
  rpc GetAccessChanges(GetAccessChangesRequest) returns (GetAccessChangesResponse);
}

// --- Enums ---

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_SCHEMA = 1;
  ARTIFACT_KIND_PLUGIN = 2;
}

enum SignatureType {
  reserved 2;
  reserved "SIGNATURE_TYPE_SIGSTORE";

  SIGNATURE_TYPE_UNSPECIFIED = 0;
  SIGNATURE_TYPE_PUBLISHING_KEY = 1;
}

enum ForgeType {
  FORGE_TYPE_UNSPECIFIED = 0;
  FORGE_TYPE_GITHUB = 1;
  FORGE_TYPE_GITLAB = 2;
  FORGE_TYPE_FORGEJO = 3;
  FORGE_TYPE_BITBUCKET = 4;
  FORGE_TYPE_CUSTOM = 5;
}

enum PublishingKeyStatus {
  PUBLISHING_KEY_STATUS_UNSPECIFIED = 0;
  PUBLISHING_KEY_STATUS_PENDING = 1;
  PUBLISHING_KEY_STATUS_ACTIVE = 2;
  PUBLISHING_KEY_STATUS_INACTIVE = 3;
  PUBLISHING_KEY_STATUS_REVOKED = 4;
}

enum SchemaUsage {
  SCHEMA_USAGE_UNSPECIFIED = 0;
  SCHEMA_USAGE_EDITORIAL = 1;
  SCHEMA_USAGE_DISTRIBUTION = 2;
  SCHEMA_USAGE_SETTINGS = 3;
  SCHEMA_USAGE_MESSAGES = 4;
}

// Reason an artifact version in a GetManifests request could not be
// resolved. A revoked version is not an error: it is returned with revoked
// set, so that a consumer learns of the revocation.
enum ManifestError {
  MANIFEST_ERROR_UNSPECIFIED = 0;
  // No such artifact, or no such version of it.
  MANIFEST_ERROR_NOT_FOUND = 1;
  // The artifact is private and neither owned by nor granted to the
  // caller's organisation.
  MANIFEST_ERROR_FORBIDDEN = 2;
  // The reference is malformed: an unknown kind, an invalid name or
  // version.
  MANIFEST_ERROR_INVALID = 3;
}

// What an access change did. Each one carries the artifact or the
// publishing key it concerns.
enum AccessChangeType {
  ACCESS_CHANGE_TYPE_UNSPECIFIED = 0;
  // An artifact version was revoked. Its assets are no longer served.
  ACCESS_CHANGE_TYPE_VERSION_REVOKED = 1;
  // A publishing key was deactivated: the artifacts it signed are no
  // longer to be picked up, until it is reactivated.
  ACCESS_CHANGE_TYPE_KEY_DEACTIVATED = 2;
  // A deactivated publishing key was activated again.
  ACCESS_CHANGE_TYPE_KEY_REACTIVATED = 3;
  // A publishing key was revoked: signatures made with it are to be
  // treated as forgeries. Permanent.
  ACCESS_CHANGE_TYPE_KEY_REVOKED = 4;
  // An artifact was made private. Sent to the organisations that lost
  // access by it.
  ACCESS_CHANGE_TYPE_ARTIFACT_MADE_PRIVATE = 5;
  // An artifact was made public.
  ACCESS_CHANGE_TYPE_ARTIFACT_MADE_PUBLIC = 6;
  // The artifact was granted to the caller's organisation.
  ACCESS_CHANGE_TYPE_GRANT_ADDED = 7;
  // A grant of the artifact to the caller's organisation was withdrawn.
  // Sent only when the organisation lost access by it.
  ACCESS_CHANGE_TYPE_GRANT_WITHDRAWN = 8;
}

// --- Common types ---

message Organisation {
  int64 id = 1;
  // Organisation URI as carried by the org claim (e.g. core://org/tt).
  string uri = 2;
  string name = 3;
  bool approved = 4;
  bool is_owner = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ArtifactInfo {
  int64 id = 1;
  // URI of the owning organisation (e.g. core://org/tt).
  string organisation = 2;
  ArtifactKind kind = 3;
  // Full artifact name in reverse-domain notation (e.g. se.tt.my-plugin).
  string name = 4;
  string created_at = 5;
  // Whether the artifact is publicly visible. Private artifacts are only
  // visible to members of the owning organisation.
  bool public = 6;
  // Schema usage category. Only meaningful when kind is ARTIFACT_KIND_SCHEMA.
  SchemaUsage schema_usage = 7;
}

message VersionInfo {
  int64 id = 1;
  string version = 2;
  SignatureType signature_type = 3;
  string signing_identity = 4;
  bool revoked = 5;
  string created_at = 6;
}

message AssetInfo {
  string filename = 1;
  string sha256 = 2;
  // The asset's role in the manifest's assets list: "js", "css",
  // "documentation", "schema", "mirror", "contract", "settings" or one of
  // the core module's roles.
  string role = 3;
  // Size in bytes.
  int64 size = 4;
}

message PublishingKeyInfo {
  int64 id = 1;
  string fingerprint = 2;
  string user_email = 3;
  PublishingKeyStatus status = 4;
  string created_at = 5;
}

// An asset to upload alongside a version.
message PublishAsset {
  string filename = 1;
  string sha256 = 2;
  bytes data = 3;
}

// --- Organisation requests/responses ---

message ListOrganisationsRequest {}
message ListOrganisationsResponse {
  repeated Organisation organisations = 1;
}

message ApproveOrganisationRequest {
  int64 id = 1;
}
message ApproveOrganisationResponse {}

// --- Artifact browsing requests/responses ---

message ListArtifactsRequest {
  // Optional filter by kind.
  ArtifactKind kind = 1;
  // Optional filter by schema usage. Only applies when kind is SCHEMA.
  SchemaUsage schema_usage = 2;
}
message ListArtifactsResponse {
  repeated ArtifactInfo artifacts = 1;
}

message GetArtifactRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
}
message GetArtifactResponse {
  ArtifactInfo artifact = 1;
  repeated VersionInfo versions = 2;
}

message GetArtifactVersionRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // Specific version string, or empty for latest.
  string version = 3;
}
message GetArtifactVersionResponse {
  ArtifactInfo artifact = 1;
  VersionInfo version = 2;
  // Raw manifest bytes.
  bytes manifest = 3;
  repeated AssetInfo assets = 4;
  // Signature over the exact manifest bytes returned in the manifest field,
  // as stored at publish time. Verify it against those bytes as they are,
  // without re-serialising, reformatting or otherwise normalising the
  // manifest.
  bytes signature = 5;
  // Raw 32-byte Ed25519 public key of the publishing key identified by
  // VersionInfo.signing_identity. A valid signature only shows which key
  // signed the manifest, not that the key is still trusted, so a consumer
  // should also check the key status through GetPublishingKey to honour
  // deactivation and revocation.
  bytes public_key = 6;
}

message GetArtifactAssetRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  string version = 3;
  string filename = 4;
}
message GetArtifactAssetResponse {
  string filename = 1;
  string sha256 = 2;
  bytes data = 3;
}

// --- Documentation requests/responses ---

message ListDocumentationRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // Specific version string (v-prefixed), or empty for latest.
  string version = 3;
}
message ListDocumentationResponse {
  // The resolved version.
  string version = 1;
  repeated AssetInfo files = 2;
}

message GetDocumentationRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // Specific version string (v-prefixed), or empty for latest.
  string version = 3;
  // Documentation file path relative to the manifest (e.g. "README.md", "agents/editing.md").
  string filename = 4;
}
message GetDocumentationResponse {
  string filename = 1;
  string sha256 = 2;
  bytes data = 3;
}

// --- Publishing requests/responses ---

message PublishVersionRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation (e.g. se.tt.my-plugin).
  string name = 2;
  string version = 3;
  // Raw manifest bytes.
  bytes manifest = 4;
  SignatureType signature_type = 5;
  // Ed25519 signature bytes.
  bytes signature = 6;
  // Publishing key fingerprint.
  string signing_identity = 7;
  repeated PublishAsset assets = 8;
  // The contract document of a plugin version that ships a contract (an
  // asset with the role "contract"): JSON naming the contract package's
  // name and version and the tarball's hex SHA-256, as
  // {"name": "@elephant-hub/<plugin>", "version": "1.2.0", "sha256": "..."}.
  // Public whatever the plugin's visibility. Empty when the version has no
  // contract.
  bytes contract_document = 9;
  // Ed25519 signature over the exact contract_document bytes, made with the
  // same publishing key as the manifest signature, so that the contract
  // verifies with the publisher's key alone. Required with a contract
  // document.
  bytes contract_signature = 10;
}
message PublishVersionResponse {
  int64 version_id = 1;
}

// A single item in a bulk publish request.
message BulkPublishItem {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation (e.g. se.tt.my-schema).
  string name = 2;
  // Raw manifest bytes.
  bytes manifest = 3;
  // Ed25519 signature bytes for this manifest.
  bytes signature = 4;
  repeated PublishAsset assets = 5;
  // The item's contract document and its signature, as in
  // PublishVersionRequest.
  bytes contract_document = 6;
  bytes contract_signature = 7;
}

message BulkPublishVersionRequest {
  // Version string applied to all items.
  string version = 1;
  SignatureType signature_type = 2;
  // Publishing key fingerprint (shared across all items).
  string signing_identity = 3;
  repeated BulkPublishItem items = 4;
}

message BulkPublishVersionResponse {
  // Version IDs in the same order as the request items.
  repeated int64 version_ids = 1;
}

message RevokeVersionRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  string version = 3;
}
message RevokeVersionResponse {}

// --- Publishing key requests/responses ---

message RegisterPublishingKeyRequest {
  // Ed25519 public key bytes.
  bytes public_key = 1;
}
message RegisterPublishingKeyResponse {
  int64 id = 1;
}

message RegisterOrgPublishingKeyRequest {
  int64 organisation_id = 1;
  // Ed25519 public key bytes.
  bytes public_key = 2;
}
message RegisterOrgPublishingKeyResponse {
  int64 id = 1;
}

message ListPublishingKeysRequest {}
message ListPublishingKeysResponse {
  repeated PublishingKeyInfo publishing_keys = 1;
}

message GetPublishingKeyRequest {
  // Publishing key fingerprint in SSH SHA256 form, as carried by
  // VersionInfo.signing_identity (e.g. "SHA256:5rMv...").
  string fingerprint = 1;
}
message GetPublishingKeyResponse {
  // Publishing key fingerprint in SSH SHA256 form.
  string fingerprint = 1;
  // Raw 32-byte Ed25519 public key.
  bytes public_key = 2;
  // Current status of the key. Only a key that is
  // PUBLISHING_KEY_STATUS_ACTIVE may publish, and a signature made by a
  // revoked key must not be trusted even if it verifies.
  PublishingKeyStatus status = 3;
  // URI of the organisation the key belongs to (e.g. core://org/tt).
  string organisation = 4;
  string created_at = 5;
}

message DeactivatePublishingKeyRequest {
  int64 id = 1;
}
message DeactivatePublishingKeyResponse {}

message ActivatePublishingKeyRequest {
  int64 id = 1;
}
message ActivatePublishingKeyResponse {}

message RevokePublishingKeyRequest {
  int64 id = 1;
}
message RevokePublishingKeyResponse {}

// --- Permission requests/responses ---

message AddAllowedPublishingKeyRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  int64 publishing_key_id = 3;
}
message AddAllowedPublishingKeyResponse {}

message RemoveAllowedPublishingKeyRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  int64 publishing_key_id = 3;
}
message RemoveAllowedPublishingKeyResponse {}

message ListArtifactPermissionsRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
}
message ListArtifactPermissionsResponse {
  repeated PublishingKeyInfo allowed_publishing_keys = 2;
  repeated ArtifactPublisherInfo publishers = 3;
}

// --- Visibility requests/responses ---

message SetArtifactVisibilityRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  bool public = 3;
}
message SetArtifactVisibilityResponse {}

// --- Grant requests/responses ---

message ArtifactGrant {
  // URI of the organisation the artifact is granted to (e.g.
  // core://org/tt).
  string organisation = 1;
  string created_at = 2;
  // Email of the user who added the grant.
  string granted_by = 3;
}

message AddArtifactGrantRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // URI of the organisation to grant the artifact to.
  string organisation = 3;
}
message AddArtifactGrantResponse {}

message RemoveArtifactGrantRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // URI of the organisation whose grant is withdrawn.
  string organisation = 3;
}
message RemoveArtifactGrantResponse {}

message ListArtifactGrantsRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
}
message ListArtifactGrantsResponse {
  repeated ArtifactGrant grants = 1;
}

// --- OIDC / CI publisher types ---

message OIDCProviderInfo {
  int64 id = 1;
  string name = 2;
  ForgeType forge_type = 3;
  string issuer_url = 4;
}

message ArtifactPublisherInfo {
  int64 id = 1;
  string provider_name = 2;
  string repository = 3;
  string ref_pattern = 4;
}

// --- Generation requests/responses ---

message SchemaRef {
  // Full schema name in reverse-domain notation (e.g. se.tt.core).
  string name = 1;
  string version = 2;
}

message RegisterGenerationRequest {
  int64 number = 1;
  repeated SchemaRef schemas = 2;
}
message RegisterGenerationResponse {
  int64 id = 1;
  int64 number = 2;
  // True when the generation was already registered by this caller.
  bool existed = 3;
}

message GetLatestGenerationRequest {}
message GetLatestGenerationResponse {
  // Zero when the caller has registered nothing yet.
  int64 number = 1;
}

message GetGenerationRequest {
  // Client id (the azp claim) of the repository that registered the
  // generation. Any client of the caller's organisation may be named.
  string client_id = 1;
  // Generation number. Zero for the latest that client registered.
  int64 number = 2;
}
message GetGenerationResponse {
  string client_id = 1;
  int64 number = 2;
  // RFC 3339.
  string registered_at = 3;
  repeated SchemaRef schemas = 4;
}

message ListGenerationsRequest {
  // Cursor from a previous response; empty for the newest.
  string cursor = 1;
  // PageSize defaults to 100, max 500.
  int64 page_size = 2;
}
message ListGenerationsResponse {
  // Newest first, by registration.
  repeated GenerationInfo generations = 1;
  // NextCursor is empty when there are no older generations.
  string next_cursor = 2;
}

message GenerationInfo {
  // Client id (the azp claim) of the client that registered the generation.
  string client_id = 1;
  int64 number = 2;
  // RFC 3339.
  string registered_at = 3;
}

// --- Plugin and schema loading requests/responses ---

message ManifestRef {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // The version, required: a consumer loads what it named.
  string version = 3;
}

message GetManifestsRequest {
  // At most 100.
  repeated ManifestRef artifacts = 1;
}

message ArtifactManifest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  // The version, normalised to the hub's v-prefixed form.
  string version = 3;
  // Raw manifest bytes.
  bytes manifest = 4;
  // Signature over the exact manifest bytes returned in the manifest
  // field, as stored at publish time. Verify it against those bytes as
  // they are, without re-serialising or otherwise normalising the
  // manifest.
  bytes signature = 5;
  // Publishing key fingerprint in SSH SHA256 form.
  string signing_identity = 6;
  // Raw 32-byte Ed25519 public key of the signing publishing key.
  bytes public_key = 7;
  // Current status of the signing key. A manifest signed by a deactivated
  // key is not to be picked up, and one signed by a revoked key is a
  // forgery, even if the signature verifies.
  PublishingKeyStatus key_status = 8;
  // Whether the version has been revoked. A revoked version's assets are
  // not served.
  bool revoked = 9;
  // The version's stored assets, the manifest's assets list as the hub
  // holds it.
  repeated AssetInfo assets = 10;
  // Set instead of the fields above when this artifact could not be
  // resolved; the other entries are unaffected.
  ManifestError error = 11;
  string error_message = 12;
}

message GetManifestsResponse {
  // In the order of the request.
  repeated ArtifactManifest artifacts = 1;
  // The GetAccessChanges cursor as of the snapshot the manifests were read
  // in. Following the feed from it misses no change to them.
  int64 access_cursor = 2;
}

message GetAssetRequest {
  ArtifactKind kind = 1;
  // Full artifact name in reverse-domain notation.
  string name = 2;
  string version = 3;
  // The asset's role in the manifest, e.g. "js" or "mirror".
  string role = 4;
  // The asset's file, as the manifest names it. Required for a role that
  // repeats, such as "documentation"; optional otherwise, and checked
  // against the asset when given.
  string file = 5;
}

// One chunk of an asset. The first message carries the asset's metadata
// as well as the first chunk of data; the others carry data only.
message GetAssetResponse {
  string file = 1;
  string role = 2;
  // Hex SHA-256 of the whole asset, as the manifest declares it.
  string sha256 = 3;
  // Size of the whole asset in bytes.
  int64 size = 4;
  bytes data = 5;
}

message GetAccessChangesRequest {
  // Return changes after this position: zero for the start of the feed, or
  // the cursor of a previous response or of GetManifests.
  int64 after = 1;
  // At most this many changes. Zero, or more than the hub's limit, takes
  // the hub's limit.
  int32 limit = 2;
}

message AccessChange {
  // Position in the feed.
  int64 id = 1;
  AccessChangeType type = 2;
  // RFC 3339.
  string created_at = 3;
  // The artifact the change concerns. Unset for a publishing key change.
  ArtifactKind kind = 4;
  string name = 5;
  // The revoked version, for ACCESS_CHANGE_TYPE_VERSION_REVOKED.
  string version = 6;
  // The key's fingerprint in SSH SHA256 form, for a publishing key change.
  string fingerprint = 7;
}

message GetAccessChangesResponse {
  // In feed order.
  repeated AccessChange changes = 1;
  // Where to continue from. It may be past the last change returned, since
  // changes the caller cannot see are skipped, and it is the request's
  // cursor when nothing has happened.
  int64 cursor = 2;
}
