syntax = "proto3";

package elephant.distribution;

option go_package = "github.com/ttab/elephant-public-api/distribution";

// Search exposes the distribution search index: a query surface over the
// documents that Content delivers, with the same visibility rules. It is
// read-only.
//
// Access requires the "dist_search" scope, which is granted by "dist_read"
// (search is a view of what the caller can already fetch) and by
// "dist_admin".
service Search {
  // Query searches one language series of one tier. Language is required
  // and a query never fans out across languages: searching several
  // languages is several calls.
  rpc Query(QueryRequest) returns (QueryResponse);
  // GetMappings returns the searchable fields of a document type and the
  // type of each field, as the union across the language indexes. Use it
  // to find out what can be queried, and how, before building a query.
  rpc GetMappings(GetMappingsRequest) returns (GetMappingsResponse);
}

message QueryRequest {
  // Language to search, as the language tag the documents are indexed
  // under, e.g. "sv" or "sv-se". Required: a query targets exactly one
  // language series so that fan-out stays explicit. An unknown language
  // is an invalid argument.
  string language = 1;
  // Tier to search: "recent" for the rolling recent window, "all" for
  // the recent window plus the archive. Empty defaults to "recent". Any
  // other value is an invalid argument.
  //
  // "recent" is not "whatever the cluster happens to hold locally". It
  // applies an implicit window on the document's anchor timestamp, so
  // that recent means the same thing on the first day of a quarter as on
  // the last. For document types anchored on when they happened - news,
  // and everything else dated by publication - that window is a
  // first_published no older than the configured recent window, 30 days
  // by default. Types that aren't partitioned by time, the entity
  // registries such as sections and authors, are never windowed and are
  // returned in full by both tiers.
  //
  // "all" searches the archive set as well. The archive is served from
  // snapshots mounted on separate nodes, so it answers more slowly, and
  // the higher latency is accepted rather than worked around - which is
  // why it is an explicit choice and not the default. Scope an archive
  // query with a range on the anchor field whenever you can: given a
  // range, the server resolves the query to the archived partitions that
  // intersect it instead of fanning out over every quarter ever indexed.
  //
  // A document that has been corrected after its partition was archived
  // exists in both tiers. Hits are collapsed on the document UUID, and
  // the field values reported are those of the highest indexed version,
  // so a cross-tier query never returns the same document twice and
  // never reports the superseded copy's values.
  string tier = 2;
  // DocumentTypes to search. Empty searches all types the caller can
  // read. A type that isn't indexed is an invalid argument.
  //
  // For a semantic query (knn) the empty list is every indexed type that
  // carries embeddings: the types that don't are skipped rather than
  // refused, since a deployment normally indexes entity registries that
  // have no vectors beside the temporal types that do. A type that is
  // named explicitly is still an invalid argument when it has no
  // embeddings - it is a question that cannot be answered, and an empty
  // result would look like one.
  repeated string document_types = 3;
  // Query to run. An absent query matches all documents.
  QueryV1 query = 4;
  // Knn is a semantic query clause: nearest neighbour search over the
  // document embeddings. See KnnQueryV1 for how the neighbours are
  // selected.
  //
  // Combining knn with query is pre-filtering, not hybrid ranking. When
  // both are set, the translated query is applied as the *filter* of the
  // knn clause: only documents that the query matches are considered as
  // neighbour candidates, and the hits are ordered by vector similarity
  // alone. Read it as "semantic search within these filters". The query
  // contributes nothing to the score even when it is written with scoring
  // clauses such as must or should - the vector similarity is the score.
  //
  // A true hybrid that merges BM25 relevance and vector similarity into a
  // combined score is not available in this version. It is planned, and
  // it will be a separate, explicitly requested mode rather than a change
  // to what query plus knn means here, so queries written against these
  // semantics keep working.
  //
  // Only document types that are indexed with embeddings can be searched
  // this way. A knn query that names a type without vectors is an invalid
  // argument; one that names no types at all is answered from the types
  // that do have them, see document_types.
  KnnQueryV1 knn = 9;
  // Size is the maximum number of hits to return. Defaults to 50, and is
  // capped by the server.
  int64 size = 5;
  // From is the number of hits to skip, for paging through a result set.
  // Deep paging is bounded by the server; use a narrower query or a sort
  // on a stable field instead of paging far into a large result.
  int64 from = 6;
  // Sort order of the hits. Empty sorts by relevance, descending.
  repeated SortV1 sort = 7;
  // Fields to return with each hit, named as flat index fields (e.g.
  // "document.title"). Empty returns hits without field values, which is
  // the cheapest form when the caller only needs the UUIDs.
  repeated string fields = 8;
  // Generation answers the query from a named index generation instead of
  // the active one, naming it as Configuration.ListIndexGenerations does.
  // Empty is the active generation, and the only value an ordinary caller
  // may send: naming a generation requires the "dist_admin" scope.
  //
  // It is the validation surface for a rebuild or a move to another
  // cluster. A candidate generation is built and kept up to date while the
  // active one serves, and this is how real queries are pointed at it and
  // the results compared before it is activated. A generation that doesn't
  // exist, or one whose cluster is unreachable, is an error rather than a
  // silent fall back to the active generation - a comparison that quietly
  // queried the wrong index set would be worse than no comparison.
  string generation = 10;
}

// QueryV1 is a single query clause. Exactly one of the conditions must be
// set; an empty QueryV1 is an invalid argument.
message QueryV1 {
  oneof conditions {
    // Bool combines subqueries.
    BoolQueryV1 bool = 1;
    // Range matches a field against an interval.
    RangeQueryV1 range = 2;
    // Exists matches documents that have a value for the named field.
    string exists = 3;
    // MatchAll matches every document.
    MatchAllQueryV1 match_all = 4;
    // Term matches an exact value.
    TermQueryV1 term = 5;
    // Terms matches any of a set of exact values.
    TermsQueryV1 terms = 6;
    // Match matches analysed text.
    MatchQueryV1 match = 7;
    // MatchPhrase matches an analysed phrase.
    MatchPhraseQueryV1 match_phrase = 8;
    // QueryString is a query in the query string mini-language. Use it
    // for user-entered search expressions; prefer the structured clauses
    // for queries the client builds itself.
    string query_string = 9;
    // Prefix matches values that start with a value.
    PrefixQueryV1 prefix = 10;
    // MultiMatch matches analysed text against several fields.
    MultiMatchQueryV1 multi_match = 11;
  }
}

// BoolQueryV1 combines subqueries. Must and should contribute to the
// score, filter and must_not don't.
message BoolQueryV1 {
  // Must are subqueries that all have to match.
  repeated QueryV1 must = 1;
  // MustNot are subqueries that must not match.
  repeated QueryV1 must_not = 2;
  // Should are subqueries that may match, see minimum_should_match.
  repeated QueryV1 should = 3;
  // Filter are subqueries that all have to match, without affecting the
  // score of the hit.
  repeated QueryV1 filter = 4;
  // MinimumShouldMatch is the number of should subqueries that have to
  // match. Defaults to 1 when the query has no must or filter subqueries,
  // 0 otherwise.
  int64 minimum_should_match = 5;
}

// RangeQueryV1 matches a field against an interval. The bounds are written
// as strings and parsed according to the type of the field, so a date
// field takes RFC 3339 timestamps and a numeric field takes numbers. At
// least one bound must be set; combining a lower and an upper bound gives
// a closed interval.
message RangeQueryV1 {
  // Field to match against.
  string field = 1;
  // Gt is an exclusive lower bound.
  string gt = 2;
  // Gte is an inclusive lower bound.
  string gte = 3;
  // Lt is an exclusive upper bound.
  string lt = 4;
  // Lte is an inclusive upper bound.
  string lte = 5;
}

// MatchAllQueryV1 matches every document. Useful as the base of a query
// that only filters, and for browsing a type by sort order.
message MatchAllQueryV1 {}

// TermQueryV1 matches an exact, unanalysed value. Use it for keyword,
// boolean, date and numeric fields; a term query against a text field
// matches individual analysed tokens, which is rarely what you want.
message TermQueryV1 {
  // Field to match against.
  string field = 1;
  // Value that the field must have.
  string value = 2;
  // Boost multiplies the score contribution of the clause. Defaults to 1.
  double boost = 3;
}

// TermsQueryV1 matches documents where the field has any of the values.
message TermsQueryV1 {
  // Field to match against.
  string field = 1;
  // Values, any one of which is a match.
  repeated string values = 2;
  // Boost multiplies the score contribution of the clause. Defaults to 1.
  double boost = 3;
}

// MatchQueryV1 matches analysed text: the value is run through the
// analyser of the field, and a document matches if any of the resulting
// terms do.
message MatchQueryV1 {
  // Field to match against.
  string field = 1;
  // Value to match.
  string value = 2;
  // Boost multiplies the score contribution of the clause. Defaults to 1.
  double boost = 3;
}

// MatchPhraseQueryV1 matches analysed text where the terms occur in the
// given order, next to each other.
message MatchPhraseQueryV1 {
  // Field to match against.
  string field = 1;
  // Value to match as a phrase.
  string value = 2;
}

// PrefixQueryV1 matches values that start with the given value. Run it
// against a keyword field, or against a field that the mappings report as
// "prefix": those are analysed for prefix matching and are much cheaper to
// search as you type.
message PrefixQueryV1 {
  // Field to match against.
  string field = 1;
  // Value that the field must start with.
  string value = 2;
  // CaseInsensitive matches regardless of case.
  bool case_insensitive = 3;
  // Boost multiplies the score contribution of the clause. Defaults to 1.
  double boost = 4;
}

// MultiMatchQueryV1 matches analysed text against several fields at once.
message MultiMatchQueryV1 {
  // Fields to match against. A field can carry a boost as a "^"-suffix,
  // e.g. "document.title^3".
  repeated string fields = 1;
  // Type is the multi-match query type. Valid values are best_fields,
  // most_fields, cross_fields, phrase, phrase_prefix and bool_prefix.
  // Defaults to best_fields.
  string type = 2;
  // Query text to match.
  string query = 3;
  // Boost multiplies the score contribution of the clause. Defaults to 1.
  double boost = 4;
  // BooleanAnd requires all terms of the query to match.
  bool boolean_and = 5;
  // MinimumShouldMatch is the number of query terms that must match when
  // the terms are combined with "or". Takes the full minimum-should-match
  // expression syntax, e.g. "2" or "75%".
  string minimum_should_match = 6;
  // TieBreaker is how much the score of matches in other fields than the
  // best-scoring one contributes, between 0 and 1. Defaults to 0, i.e.
  // only the best field counts.
  float tie_breaker = 7;
  // PrefixLength is the number of leading characters that fuzzy matching
  // leaves unchanged. Defaults to 0.
  int64 prefix_length = 8;
  // Fuzziness is the edit distance allowed when matching terms. Absent
  // means exact term matching.
  Fuzziness fuzziness = 9;
}

// Fuzziness is the edit distance allowed when matching terms.
message Fuzziness {
  // Edits is the maximum allowed Levenshtein edit distance. Valid values
  // are 0, 1 and 2.
  int64 edits = 1;
  // Auto derives the allowed edit distance from the length of the term.
  // Takes precedence over edits when set.
  FuzzinessAuto auto = 2;
}

// FuzzinessAuto configures automatic fuzziness thresholds. The low and
// high values are the term length boundaries for the edit distance tiers:
//
//   - Terms shorter than low characters must match exactly (0 edits).
//   - Terms of low to high-1 characters allow at most 1 edit.
//   - Terms of high characters or more allow at most 2 edits.
//
// Both zero uses the default thresholds, 3 and 6.
message FuzzinessAuto {
  // Low is the term length where 1 edit starts being allowed.
  int64 low = 1;
  // High is the term length where 2 edits start being allowed.
  int64 high = 2;
}

// KnnQueryV1 is a semantic query: it looks up the documents whose
// embeddings are closest to a query vector, rather than the documents that
// contain the query terms.
//
// The clause has two independent choices, and the server validates both -
// the fields are plain fields rather than oneofs so that the combinations
// can be relaxed later without renumbering, but an invalid combination is
// rejected as an invalid argument, it is never guessed at.
//
//  1. Where the query vector comes from: exactly one of text and vector.
//  2. How many neighbours come back: exactly one of k and min_similarity.
//
// Similarity is cosine similarity throughout, in the range [-1, 1], where
// higher means closer and 1 means identical direction. The embeddings are
// normalized, so this is the same dial as maximum inner product; the
// server converts from OpenSearch's own score space so that both
// min_similarity and the per-hit scores are stated as cosine similarity.
// Hit.score for a knn hit is therefore directly comparable to
// min_similarity, which is how a threshold is found: run a k query, look
// at where the results stop being relevant, and read the threshold off the
// scores.
//
// Thresholds are model-dependent and are not portable between deployments
// or across an embedding model upgrade. Treat a min_similarity value as
// something to recalibrate, not as a constant.
message KnnQueryV1 {
  // Text to search for, embedded server-side with the current embedding
  // model. This is the normal way to run a semantic query, and the only
  // one that survives a model upgrade unchanged, since the server
  // re-embeds the text with whatever model is current.
  string text = 1;
  // Vector to search for, as a raw embedding. Advanced use: the caller has
  // to produce it with the same model and dimension as the index, and a
  // model upgrade invalidates it. Prefer text unless the vector comes from
  // somewhere the server cannot re-derive it from. A vector of the wrong
  // dimension is an invalid argument.
  repeated float vector = 2;
  // K is the number of nearest neighbours to retrieve. The hits come back
  // ordered by similarity, and there are always k of them (fewer only when
  // the filtered candidate set is smaller), no matter how poor the last
  // ones are - a k query has no relevance floor. Mutually exclusive with
  // min_similarity, and one of the two must be set.
  int64 k = 3;
  // MinSimilarity turns the clause into a radial query: every document at
  // or above this cosine similarity is a hit, however many that turns out
  // to be, up to size. Use it when "everything that is at least this
  // close" is the question - it makes a result set that does not silently
  // pad itself with weak matches the way a fixed k does, and it is the
  // same predicate that subscriptions match on, so a query is how a
  // subscription threshold is previewed.
  //
  // Cosine similarity in [-1, 1]; higher is closer. Mutually exclusive
  // with k, and one of the two must be set. The field is optional so that
  // a floor of 0 - every document that isn't pointing away from the query
  // - can be asked for, and is distinct from not asking for a radial
  // query at all.
  optional float min_similarity = 4;
}

// SortV1 sorts the hits on a field. Sort on keyword, date, boolean or
// numeric fields; text fields aren't sortable.
message SortV1 {
  // Field to sort on.
  string field = 1;
  // Desc sorts in descending order instead of ascending.
  bool desc = 2;
}

message QueryResponse {
  // Total number of documents that matched the query, which can be more
  // than the number of returned hits.
  HitsTotal total = 1;
  // Hits in the requested order, at most size of them.
  repeated Hit hits = 2;
}

// HitsTotal is the number of matching documents. The count is exact up to
// a server-side limit, above which it is reported as a lower bound.
message HitsTotal {
  // Value is the number of matching documents, interpreted according to
  // relation.
  int64 value = 1;
  // Relation is "eq" when value is the exact number of matches, and "gte"
  // when the matches were only counted up to value.
  string relation = 2;
}

message Hit {
  // ID is the UUID of the document. Pass it to Content.GetDocument to
  // fetch the document itself.
  string id = 1;
  // Score is the relevance score of the hit. Only meaningful for hits
  // ordered by relevance; a sorted query leaves it at zero.
  //
  // For a knn query the score is the cosine similarity of the document to
  // the query vector, in [-1, 1] and on the same scale as
  // KnnQueryV1.min_similarity: the server converts it out of OpenSearch's
  // score space so that the two can be compared directly. For a text query
  // it is an unbounded BM25 score, comparable between hits of the same
  // query and meaningless between queries.
  float score = 2;
  // Fields are the values of the requested fields, keyed by field name.
  // Fields without a value for the document are absent.
  map<string, StringValues> fields = 3;
}

// StringValues is the value of a flat index field. All field values are
// carried as strings regardless of the type of the field; dates are RFC
// 3339. A field is always a list because flattening a document collapses
// repeated blocks into parallel lists - values of the same block instance
// can't be paired up across fields.
message StringValues {
  // Values of the field, in index order.
  repeated string values = 1;
}

message GetMappingsRequest {
  // DocumentType to get the mappings of. Required.
  string document_type = 1;
}

message GetMappingsResponse {
  // Properties of the document type, sorted by name.
  repeated MappingProperty properties = 1;
}

// MappingProperty is a searchable field of a document type.
message MappingProperty {
  // Name of the property, as used in queries.
  string name = 1;
  // Type of the property: "text", "keyword", "date", "long", "double",
  // "boolean", or "alias" for a property that is another name for the
  // property named by path.
  string type = 2;
  // Path is the property that an alias property points to. Empty for
  // everything but aliases.
  string path = 3;
  // Fields are alternative indexings of the property, queried as
  // "name.field". A text property commonly has a "keyword" field for
  // exact matching and sorting, and a "prefix" field for as-you-type
  // matching.
  repeated MappingField fields = 4;
}

// MappingField is an alternative indexing of a property.
message MappingField {
  // Name of the field, appended to the property name with a dot to query
  // it.
  string name = 1;
  // Type of the field, from the same vocabulary as the property type,
  // plus "prefix" for fields analysed for prefix matching.
  string type = 2;
}
